name: Module - Run Test
on:
  workflow_call:
    inputs:
      db_ip:
        required: true
        type: string
      app_ip:
        required: true
        type: string
      util_ip:
        required: true
        type: string
      util_priv_ip:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      EC2_SSH_KEY:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      DB_PASSWORD:
        required: true
      MQ_PASSWORD:
        required: true
      KAKAO_CLIENT_ID:
        required: true
      KAKAO_CLIENT_SECRET:
        required: true
      FINTECH_API_KEY:
        required: true
      GEMINI_PROJECT_ID:
        required: true

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # ------------------------------------------------------------------------
      # 1. DB 서버 배포 (Only MySQL) -> t3.medium
      # ------------------------------------------------------------------------
      - name: Deploy DB Server
        uses: appleboy/ssh-action@v0.1.10
        env:
          DB_PW: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ inputs.db_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PW
          script: |
            sudo docker rm -f $(sudo docker ps -aq) 2>/dev/null || true
            
            # MySQL 단독 실행 (메모리 여유 확보)
            cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              mysql:
                image: 'choijake/nextdoor-mysql:perf-data' 
                ports: ['3306:3306']
                user: root
                environment:
                  - 'MYSQL_DATABASE=nextdoor'
                  - "MYSQL_ROOT_PASSWORD=$DB_PW"
                # t3.medium(4GB) 기준 버퍼풀 2G 할당
                command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb_buffer_pool_size=2G
                restart: always
            EOF
            
            sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            sudo docker-compose pull
            sudo docker-compose up -d

      # ------------------------------------------------------------------------
      # 2. Util 서버 배포 (Cache, Search, MQ + Monitoring) -> t3.large
      # ------------------------------------------------------------------------

      # [2-1] 초기화 및 디렉토리 생성
      - name: Deploy Util - Prepare
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ inputs.util_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker rm -f $(sudo docker ps -aq) 2>/dev/null || true
            rm -rf /home/ubuntu/monitoring
            
            # Redis 데이터 폴더 생성
            mkdir -p /home/ubuntu/redis_data
            
            # 모니터링 폴더 생성
            mkdir -p /home/ubuntu/monitoring/prometheus
            mkdir -p /home/ubuntu/monitoring/grafana/provisioning/datasources
            mkdir -p /home/ubuntu/monitoring/grafana/provisioning/dashboards
            mkdir -p /home/ubuntu/monitoring/grafana/dashboards_json

      # [2-2] dump.rdb 파일 업로드 (Git -> Util Server)
      - name: Upload Redis Dump
        uses: appleboy/scp-action@master
        with:
          host: ${{ inputs.util_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/nextdoor/data/dump.rdb"
          target: "/home/ubuntu/redis_data/"
          strip_components: 3

      - name: Upload Custom Dashboard
        uses: appleboy/scp-action@master
        with:
          host: ${{ inputs.util_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "performance/dashboards/springboot.json"
          target: "/home/ubuntu/monitoring/grafana/dashboards_json/"
          strip_components: 2

      # [2-4] 실행 (설정 파일 생성 & Docker Compose)
      - name: Deploy Util - Start
        uses: appleboy/ssh-action@v0.1.10
        env:
          APP_IP: ${{ inputs.app_ip }}
          DB_IP: ${{ inputs.db_ip }}
          MQ_PW: ${{ secrets.MQ_PASSWORD }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        with:
          host: ${{ inputs.util_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_IP,DB_IP,MQ_PW,DOCKER_USER
          script: |
            # 1. Redis 파일 권한 설정 (컨테이너 내부 접근용)
            chmod 777 /home/ubuntu/redis_data/dump.rdb
            
            cd /home/ubuntu/monitoring
            
            # 2. Prometheus Config 
            cat <<EOF > prometheus/prometheus.yml
            global:
              scrape_interval: 5s
            scrape_configs:
              - job_name: 'nextdoor-app'
                metrics_path: '/actuator/prometheus'
                static_configs:
                  - targets: ['$APP_IP:8080']
                    labels:
                      application: 'NextDoor-App'
            
              - job_name: 'mysql-exporter'
                static_configs:
                  - targets: ['$APP_IP:9104']
                    labels:
                      application: 'NextDoor-DB'

              - job_name: 'node-exporter'
                static_configs:
                  - targets: ['$APP_IP:9100']
                    labels:
                      application: 'App-Server-Node'
            EOF

            # 3. Grafana Datasource
            cat <<EOF > grafana/provisioning/datasources/datasource.yml
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                uid: prometheus
                access: proxy
                url: http://prometheus:9090
                isDefault: true
            EOF

            # 4. Grafana Dashboard Provider
            cat <<EOF > grafana/provisioning/dashboards/dashboard.yml
            apiVersion: 1
            providers:
              - name: 'Default'
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                updateIntervalSeconds: 10
                options:
                  path: /etc/grafana/dashboards
            EOF

            # 5. 대시보드 설정
            # - 업로드된 springboot.json의 UID 수정 (대소문자 매칭)
            sed -i 's/"uid": "Prometheus"/"uid": "prometheus"/g' grafana/dashboards_json/springboot.json
            
            # - MySQL 대시보드 추가 다운로드
            curl -f -L -o grafana/dashboards_json/mysql.json https://grafana.com/api/dashboards/7362/revisions/5/download
            sed -i 's/${DS_PROMETHEUS}/prometheus/g' grafana/dashboards_json/mysql.json

            # 6. Docker Compose (Redis, Mongo, ES, MQ, Monitoring)
            cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              redis:
                image: 'choijake/nextdoor-redis:perf-data'
                ports: ['6379:6379']
                # [중요] 호스트의 redis_data 폴더(dump.rdb 포함)를 컨테이너의 /data 로 마운트
                volumes:
                  - /home/ubuntu/redis_data:/data
                command: redis-server --appendonly no --maxmemory 2gb --maxmemory-policy allkeys-lru
            
              rabbitmq:
                image: 'rabbitmq:3-management'
                ports: ['5672:5672', '15672:15672']
                environment:
                  - 'RABBITMQ_DEFAULT_USER=ssafy'
                  - "RABBITMQ_DEFAULT_PASS=$MQ_PW"
            
              mongodb:
                image: 'mongo:6.0'
                ports: ['27017:27017']
                command: ["mongod", "--wiredTigerCacheSizeGB", "1.0"]

              elasticsearch:
                image: $DOCKER_USER/nextdoor-es:perf
                ports: ['9200:9200']
                environment:
                  - 'discovery.type=single-node'
                  - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
                  - 'xpack.security.enabled=false'

              prometheus:
                image: prom/prometheus:latest
                container_name: prometheus
                volumes:
                  - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
                ports:
                  - "9090:9090"
                command:
                  - '--config.file=/etc/prometheus/prometheus.yml'
                  - '--web.enable-remote-write-receiver'
                restart: always

              grafana:
                image: grafana/grafana:latest
                container_name: grafana
                ports:
                  - "3000:3000"
                environment:
                  - GF_SECURITY_ADMIN_PASSWORD=admin
                  - GF_INSTALL_PLUGINS=grafana-clock-panel
                volumes:
                  - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
                  - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
                  - ./grafana/dashboards_json:/etc/grafana/dashboards
                depends_on:
                  - prometheus
                restart: always
            EOF
            
            sudo docker login -u $DOCKER_USER -p ${{ secrets.DOCKER_PASSWORD }}
            sudo docker-compose pull
            sudo docker-compose up -d

      # ------------------------------------------------------------------------
      # 3. App 서버 배포 (App + Exporters) -> t3.medium
      # ------------------------------------------------------------------------
      - name: Deploy App Server
        uses: appleboy/ssh-action@v0.1.10
        env:
          DB_PW: ${{ secrets.DB_PASSWORD }}
          MQ_PW: ${{ secrets.MQ_PASSWORD }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          KAKAO_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          FINTECH_KEY: ${{ secrets.FINTECH_API_KEY }}
          GEMINI_PROJECT: ${{ secrets.GEMINI_PROJECT_ID }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DB_HOST: ${{ inputs.db_ip }}
          UTIL_HOST: ${{ inputs.util_ip }}
        with:
          host: ${{ inputs.app_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PW,MQ_PW,DOCKER_USER,KAKAO_ID,KAKAO_SECRET,FINTECH_KEY,GEMINI_PROJECT,AWS_KEY,AWS_SECRET,DB_HOST,UTIL_HOST
          script: |
            sudo docker rm -f $(sudo docker ps -aq) 2>/dev/null || true
            
            # 1. MySQL Exporter 설정 파일 (.my.cnf)
            cat <<EOF > .my.cnf
            [client]
            user=root
            password=$DB_PW
            host=$DB_HOST
            port=3306
            EOF
            chmod 644 .my.cnf

            # 2. Docker Compose (App + Sidecars)
            cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              nextdoor-app:
                image: $DOCKER_USER/nextdoor-app:perf
                ports: ['8080:8080']
                environment:
                  - APP_NAME="NextDoor-App"
                  - SERVER_PORT=8080
                  - SPRING_PROFILES_ACTIVE=dev
            
                  - SPRING_DATASOURCE_URL=jdbc:mysql://$DB_HOST:3306/nextdoor?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
                  - SPRING_DATASOURCE_USERNAME=root
                  - SPRING_DATASOURCE_PASSWORD=$DB_PW
            
                  - SPRING_DATA_REDIS_HOST=$UTIL_HOST
                  - SPRING_RABBITMQ_HOST=$UTIL_HOST
                  - SPRING_RABBITMQ_USERNAME=ssafy
                  - SPRING_RABBITMQ_PASSWORD=$MQ_PW
                  - SPRING_DATA_MONGODB_URI=mongodb://$UTIL_HOST:27017/nextdoor
                  - SPRING_ELASTICSEARCH_URIS=http://$UTIL_HOST:9200
            
                  # API Keys
                  - KAKAO_CLIENT_ID=$KAKAO_ID
                  - KAKAO_CLIENT_SECRET=$KAKAO_SECRET
                  - FINTECH_API_KEY=$FINTECH_KEY
                  - GEMINI_PROJECT_ID=$GEMINI_PROJECT
                  - AWS_ACCESS_KEY_ID=$AWS_KEY
                  - AWS_SECRET_ACCESS_KEY=$AWS_SECRET

              # MySQL Exporter (Sidecar)
              mysqld-exporter:
                image: prom/mysqld-exporter
                ports: ['9104:9104']
                volumes:
                  - ./.my.cnf:/.my.cnf
            
              # Node Exporter (Sidecar)
              node-exporter:
                image: prom/node-exporter:latest
                ports: ['9100:9100']
                command:
                  - '--path.procfs=/host/proc'
                  - '--path.sysfs=/host/sys'
                  - '--collector.filesystem.ignored-mount-points'
                  - '^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'
                volumes:
                  - /proc:/host/proc:ro
                  - /sys:/host/sys:ro
                  - /:/rootfs:ro
            EOF
            
            sudo docker login -u $DOCKER_USER -p ${{ secrets.DOCKER_PASSWORD }}
            sudo docker-compose pull
            sudo docker-compose up -d

      # ------------------------------------------------------------------------
      # 4. 테스트 스크립트 실행 (Util 서버에서 k6 실행)
      # ------------------------------------------------------------------------
      - name: Upload Test Scripts
        uses: appleboy/scp-action@master
        with:
          host: ${{ inputs.util_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "performance/scripts/*"
          target: "/home/ubuntu/"

      - name: Run k6
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ inputs.util_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            SCRIPT_PATH=$(find /home/ubuntu -name "test.js" | head -n 1)
            if [ -z "$SCRIPT_PATH" ]; then
                echo "❌ Error: test.js not found!" > /home/ubuntu/k6-report.html
                exit 0
            fi
            
            echo "🚀 Executing k6 on $SCRIPT_PATH targeting ${{ inputs.app_ip }}..."
            k6 run -e TARGET_IP=${{ inputs.app_ip }} $SCRIPT_PATH || true

      - name: Download Report
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          scp -o StrictHostKeyChecking=no -i private_key.pem ubuntu@${{ inputs.util_ip }}:/home/ubuntu/k6-report.html ./k6-report.html
          rm private_key.pem

      - name: Share Report
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: k6-report.html