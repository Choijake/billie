# geo-benchmark: application-benchmark.yml의 검증된 exclude 목록 이식 + web 서버 활성화
spring:
  docker:
    compose:
      enabled: false

  main:
    allow-bean-definition-overriding: true
    # web-application-type 미지정 → 기본값 servlet (HTTP 서버 활성화)

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.ai.model.vertexai.autoconfigure.gemini.VertexAiGeminiChatAutoConfiguration
      - org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiEmbeddingConnectionAutoConfiguration

  data:
    mongodb:
      repositories:
        type: none
    redis:
      host: bench-redis
      port: 6379
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
      timeout: 3000ms

  datasource:
    url: jdbc:mysql://bench-mysql:3306/nextdoor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50

  flyway:
    enabled: false

  elasticsearch:
    uris: bench-es:9200

  task:
    execution:
      thread-name-prefix: geo-bench-async-
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 500
    scheduling:
      pool:
        size: 4

server:
  port: 8081

feed:
  page-size: 20
  session:
    size: 200
    ttl-seconds: 1200
  geo:
    limit: 500
  search:
    radius-km: 5
  backfill:
    extra-window: 50
  metadata:
    ttl-seconds: 3600
  deleted:
    ttl-seconds: 7200

custom:
  elasticsearch:
    enabled: true
  fintech:
    apiKey: benchmark-dummy-key
  google:
    ai:
      gemini:
        model:
          flash: gemini-dummy
          pro: gemini-dummy
          flashHigh: gemini-dummy
        location: us-central1
        project-id: benchmark-dummy
  damage-analyzer-prompt-location: classpath:dummy.txt
  summarizer-prompt-location: classpath:dummy.txt
  pair-damage-comparator-prompt-location: classpath:dummy.txt
  product-analyzer-prompt-location: classpath:dummy.txt
  product-condition-analyzer-prompt-location: classpath:dummy.txt

cloud:
  aws:
    credentials:
      access-key: test
      secret-key: test
    s3:
      bucket: benchmark-dummy-bucket
    region:
      static: us-east-1

sqs:
  queue:
    reindex: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/billie-indexer-queue
    post-index: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/post-index.fifo

spring.cloud.aws:
  region:
    static: us-east-1
  credentials:
    access-key: test
    secret-key: test
  sqs:
    endpoint: http://bench-localstack:4566

search:
  indexName: posts
  outbox:
    batchSize: 100
    claimTtlSec: 120
    pollDelayMs: 2000
    markChunkSize: 1000
  bulk:
    maxConcurrency: 2
    sliceMaxActions: 300
    scheduleMs: 1000
    targetSliceBytes: 8388608
    maxSliceBytes: 15728640
  sqs:
    batchLimit: 10

logging:
  level:
    root: WARN
    com.nextdoor.nextdoor.domain.feed: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: geo-benchmark
