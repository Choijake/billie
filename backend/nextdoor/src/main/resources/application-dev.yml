spring:
  config:
    import: optional:classpath:application-secret.yml

  main:
    lazy-initialization: false

  application:
    name: nextdoor

  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

  transaction:
    default-timeout: 30

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 3000
      leak-detection-threshold: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        use_sql_comments: true
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
    defer-datasource-initialization: true
    show-sql: false
    generate_statistics: true
    session:
      events:
        log:
          SLOWER_THAN_MS: 100

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
      timeout: 3000ms

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GEMINI_PROJECT_ID:dummy-project-id}
          location: us-central1

feed:
  geo:
    radius-km: 5.0
    candidate-size: 200
    final-size: 20

  sync:
    interval-ms: 600000
    db-concurrency: 3

  cache:
    post-ttl-hours: 1

logging:
  level:
    root: INFO
    com.nextdoor: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: INFO

server:
  port: 8081
  tomcat:
    threads:
      max: 50
      min-spare: 5
    accept-count: 50

management:
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  endpoints:
    web:
      exposure:
        include: "health, info, prometheus, metrics"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

custom:
  fintech:
    apiKey: ${FINTECH_API_KEY:dummy-key}

  google:
    ai:
      gemini:
        project-id: ${GEMINI_PROJECT_ID:dummy-project-id}
        model:
          flash: gemini-2.5-flash-preview-05-20
          pro: gemini-2.5-pro-preview-05-06
          flashHigh: gemini-2.5-flash-preview-05-20
        location: us-central1
  damage-analyzer-prompt-location: damageAnalyzerPrompt.txt
  summarizer-prompt-location: summarizerPrompt.txt
  pair-damage-comparator-prompt-location: pairDamageComparatorPrompt.txt
  product-analyzer-prompt-location: productAnalyzerPrompt.txt
  product-condition-analyzer-prompt-location: productConditionAnalyzerPrompt.txt

cloud:
  aws:
    region:
      static: ap-northeast-2
    stack:
      auto: false
    s3:
      bucket: oneders
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}